<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<meta name="mobile-web-app-capable" content="yes">
<title>Voidsmith</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
<style>
#splash{position:fixed;inset:0;z-index:99999;background:#0b0810 url(assets/ui/loading.jpg) center/cover no-repeat;transition:opacity .5s ease;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 3.2vh) 0 calc(env(safe-area-inset-bottom) + 5vh)}
#splash.out{opacity:0;pointer-events:none}
#splash h1{margin:0;font:700 clamp(30px,10vw,46px)/1 'Chakra Petch',system-ui,sans-serif;letter-spacing:.16em;color:#fff;text-shadow:0 2px 0 #000,0 0 14px #ff7a2fcc,0 0 3px #000;padding-left:.16em}
#splash .ld{width:min(62vw,300px);height:12px;border-radius:7px;border:2px solid #000;background:#000a;overflow:hidden;box-shadow:0 0 12px #ff7a2f55}
#splash .ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a2f,#ffc83d);animation:ldfill 1.25s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes ldfill{to{width:100%}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><h1>VOIDSMITH</h1><div class="ld"><i></i></div></div>
<div id="app">
  <header>
    <button class="who" data-act="profile" data-v="main" aria-label="Profile"><div class="avatar" id="avatar"></div>
      <div class="wm"><div id="callsign" class="cs"></div><div class="pw"><svg viewBox="0 0 24 24" class="swd" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="3.5" fill="#ffc83d"/><rect x="5.2" y="4.5" width="3.2" height="8" rx="1.6" fill="#ffc83d"/><rect x="8.9" y="3.5" width="3.2" height="9" rx="1.6" fill="#ffc83d"/><rect x="12.6" y="3.8" width="3.2" height="8.7" rx="1.6" fill="#ffc83d"/><rect x="16.2" y="5" width="3" height="7.5" rx="1.5" fill="#ffc83d"/></svg><span id="power">0</span></div></div></button>
    <div class="wallet">
      <div class="cur" data-coin="credits"><b id="credits">0</b></div>
      <div class="cur" data-coin="flux"><b id="flux">0</b></div>
      <div class="cur" data-coin="shards"><b id="shards">0</b></div>
      <span id="alloy" hidden></span><span id="rate" hidden></span>
    </div>
  </header>
  <main>
    <section id="tab-foundry" class="tab on"></section>
    <section id="tab-armory" class="tab"></section>
    <section id="tab-drones" class="tab"></section>
    <section id="tab-missions" class="tab"></section>
    <section id="tab-depot" class="tab"></section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <nav>
    <button data-tab="foundry" class="on"><i>⚒</i><span>Forge</span><em class="dot" hidden></em></button>
    <button data-tab="missions"><i>✸</i><span>Battle</span><em class="dot" hidden></em></button>
    <button data-tab="armory"><i>▦</i><span>Lab</span><em class="dot" hidden></em></button>
    <button data-tab="drones"><i>✈</i><span>Drones</span></button>
    <button data-tab="depot"><i>$</i><span>Shop</span><em class="dot" hidden></em></button>
  </nav>
  <div id="modal" class="modal" hidden><div class="mbox" id="mbox"></div></div>
</div>
<script src="core.js"></script>
<script src="ship.js"></script>
<script src="persist.js"></script>
<script src="cloud.js"></script>
<script src="game.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { var chk = function () { try { reg.update(); } catch (e) {} }; document.addEventListener('visibilitychange', function () { if (!document.hidden) chk(); }); setInterval(chk, 300000); }).catch(function () {}); var had = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', function () { if (had) location.reload(); });</script>
<script>(function(){var t0=Date.now(),sp=document.getElementById('splash');function hide(){if(!sp)return;sp.classList.add('out');setTimeout(function(){sp.remove()},600)}
function go(){setTimeout(hide,Math.max(0,1300-(Date.now()-t0)))}
if(document.readyState==='complete')go();else window.addEventListener('load',go);setTimeout(hide,6000)})()</script>
</body>
</html>
