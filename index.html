<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<meta name="mobile-web-app-capable" content="yes">
<title>Voidsmith</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <div class="hl"><div class="game">VOIDSMITH</div><div id="callsign" class="dim"></div></div>
    <div class="hr"><div class="dim tiny">SHIP POWER</div><div id="power">0</div></div>
  </header>
  <div class="wallet">
    <div class="cur"><span class="cn">ALLOY</span><b id="alloy">0</b><span id="rate" class="dim tiny"></span></div>
    <div class="cur"><span class="cn">CREDITS</span><b id="credits">0</b></div>
    <div class="cur"><span class="cn">FLUX</span><b id="flux">0</b></div>
    <div class="cur"><span class="cn">SHARDS</span><b id="shards">0</b></div>
  </div>
  <div class="xp"><span id="lvl" class="dim tiny"></span><div class="bar"><i id="xpfill"></i></div></div>
  <main>
    <section id="tab-foundry" class="tab on"></section>
    <section id="tab-ship" class="tab"></section>
    <section id="tab-armory" class="tab"></section>
    <section id="tab-wing" class="tab"></section>
    <section id="tab-missions" class="tab"></section>
    <section id="tab-depot" class="tab"></section>
    <section id="tab-more" class="tab"></section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <nav>
    <button data-tab="foundry" class="on"><i>⚒</i><span>Foundry</span><em class="dot" hidden></em></button>
    <button data-tab="missions"><i>✸</i><span>Missions</span><em class="dot" hidden></em></button>
    <button data-tab="ship"><i>▲</i><span>Ship</span><em class="dot" hidden></em></button>
    <button data-tab="armory"><i>▦</i><span>Armory</span></button>
    <button data-tab="wing"><i>✈</i><span>Wing</span></button>
    <button data-tab="depot"><i>⛟</i><span>Depot</span><em class="dot" hidden></em></button>
    <button data-tab="more"><i>≡</i><span>More</span></button>
  </nav>
  <div id="modal" class="modal" hidden><div class="mbox" id="mbox"></div></div>
</div>
<script src="core.js"></script>
<script src="persist.js"></script>
<script src="game.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
</html>
