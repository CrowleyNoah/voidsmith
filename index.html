<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<meta name="mobile-web-app-capable" content="yes">
<title>Voidsmith</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <div class="who"><div class="avatar"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#2b3190"/><path d="M9 26c0-10 4-15 11-15s11 5 11 15z" fill="#7d8cff"/><rect x="11" y="19" width="18" height="7" rx="3" fill="#35f0ff"/><path d="M20 4l3 8h-6z" fill="#ffc83d"/></svg></div>
      <div class="wm"><div id="callsign" class="cs"></div><div class="pw"><svg viewBox="0 0 24 24" class="swd" aria-hidden="true"><path d="M4 20L18 6l2 2L6 22zM14 4h6v6l-2-2z" fill="#ffc83d"/></svg><span id="power">0</span></div></div></div>
    <div class="wallet">
      <div class="cur" data-coin="credits"><b id="credits">0</b></div>
      <div class="cur" data-coin="flux"><b id="flux">0</b></div>
      <div class="cur" data-coin="shards"><b id="shards">0</b></div>
      <span id="alloy" hidden></span><span id="rate" hidden></span>
    </div>
  </header>
  <main>
    <section id="tab-foundry" class="tab on"></section>
    <section id="tab-ship" class="tab"></section>
    <section id="tab-armory" class="tab"></section>
    <section id="tab-wing" class="tab"></section>
    <section id="tab-missions" class="tab"></section>
    <section id="tab-depot" class="tab"></section>
    <section id="tab-more" class="tab"></section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <nav>
    <button data-tab="foundry" class="on"><i>⚒</i><span>Foundry</span><em class="dot" hidden></em></button>
    <button data-tab="missions"><i>✸</i><span>Missions</span><em class="dot" hidden></em></button>
    <button data-tab="ship"><i>▲</i><span>Ship</span><em class="dot" hidden></em></button>
    <button data-tab="armory"><i>▦</i><span>Lab</span></button>
    <button data-tab="wing"><i>✈</i><span>Wing</span></button>
    <button data-tab="depot"><i>⛟</i><span>Depot</span><em class="dot" hidden></em></button>
    <button data-tab="more"><i>≡</i><span>More</span></button>
  </nav>
  <div id="modal" class="modal" hidden><div class="mbox" id="mbox"></div></div>
</div>
<script src="core.js"></script>
<script src="persist.js"></script>
<script src="cloud.js"></script>
<script src="game.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { var chk = function () { try { reg.update(); } catch (e) {} }; document.addEventListener('visibilitychange', function () { if (!document.hidden) chk(); }); setInterval(chk, 300000); }).catch(function () {}); var had = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', function () { if (had) location.reload(); });</script>
</body>
</html>
